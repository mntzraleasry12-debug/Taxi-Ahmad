
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تكسي العراق</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
  box-sizing: border-box;
  font-family: Arial;
}

body {
  margin: 0;
  background: #f1f4f9;
  color: #17243a;
}

header {
  background: #102b55;
  color: white;
  padding: 22px;
  text-align: center;
  border-radius: 0 0 25px 25px;
}

header h2 {
  margin: 0;
}

header p {
  color: #e6c36b;
}

.container {
  padding: 15px;
  max-width: 600px;
  margin: auto;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 17px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px #00000010;
}

label {
  display: block;
  margin: 12px 0 7px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #102b55;
  color: white;
  font-size: 17px;
  margin-top: 12px;
  cursor: pointer;
}

button.gold {
  background: #c49a39;
}

button:active {
  opacity: .8;
}

#map {
  height: 280px;
  border-radius: 15px;
  margin-top: 12px;
}

.price {
  font-size: 25px;
  color: #b58b2d;
  font-weight: bold;
  text-align: center;
  margin: 15px;
}

.nav {
  display: flex;
  justify-content: space-around;
  background: white;
  padding: 14px 5px;
  position: sticky;
  bottom: 0;
}

.nav button {
  width: auto;
  margin: 0;
  background: transparent;
  color: #102b55;
  font-size: 13px;
  padding: 8px;
}

.hidden {
  display: none;
}

.order {
  border-bottom: 1px solid #eee;
  padding: 12px 0;
}
</style>
</head>

<body>

<header>
  <h2>🚕 تكسي العراق</h2>
  <p>مشوارك بأمان وراحة</p>
</header>

<div class="container">

<section id="home">

<div class="card">
<h3>أهلاً بك 👋</h3>
<p>إلى أين تريد الذهاب اليوم؟</p>

<label>موقع الانطلاق</label>
<input id="from" placeholder="حدد موقع الانطلاق">

<label>الوجهة</label>
<input id="to" placeholder="أين تريد الذهاب؟">

<label>نوع السيارة</label>
<select id="car">
<option value="1000">اقتصادية</option>
<option value="1500">مريحة</option>
<option value="2000">عائلية</option>
</select>

<div id="map"></div>

<button class="gold" onclick="myLocation()">
📍 تحديد موقعي الحالي
</button>

<button onclick="calculate()">
احسب الأجرة
</button>

<div class="price" id="price">
0 دينار
</div>

<button onclick="orderTaxi()">
🚕 اطلب تكسي الآن
</button>

</div>
</section>

<section id="orders" class="hidden">
<div class="card">
<h3>📋 طلباتي</h3>
<div id="orderList">لا توجد طلبات حالياً</div>
</div>
</section>

<section id="driver" class="hidden">
<div class="card">
<h3>🚖 وضع السائق</h3>
<p>يمكنك تغيير حالة السائق:</p>
<select id="driverStatus">
<option>غير متاح</option>
<option>متاح للعمل</option>
</select>
<button onclick="changeDriver()">
حفظ الحالة
</button>
<p id="driverMessage"></p>
</div>
</section>

</div>

<div class="nav">
<button onclick="showPage('home')">🏠 الرئيسية</button>
<button onclick="showPage('orders')">📋 طلباتي</button>
<button onclick="showPage('driver')">🚕 السائق</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([31.057, 46.257], 13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
  attribution: '© OpenStreetMap'
}
).addTo(map);

let marker;
let distance = 5;
let fare = 0;
let orders = [];

function myLocation() {

  if (!navigator.geolocation) {
    alert("جهازك لا يدعم تحديد الموقع");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {

      let lat = position.coords.latitude;
      let lng = position.coords.longitude;

      map.setView([lat, lng], 16);

      if (marker) map.removeLayer(marker);

      marker = L.marker([lat, lng])
        .addTo(map)
        .bindPopup("موقعك الحالي")
        .openPopup();

      document.getElementById('from').value =
      lat.toFixed(5) + "," + lng.toFixed(5);

    },
    function() {
      alert("تعذر تحديد موقعك. تأكد من تفعيل GPS");
    }
  );
}

function calculate() {

  let carPrice =
  Number(document.getElementById('car').value);

  fare = 1500 + (distance * carPrice);

  document.getElementById('price').innerText =
  Math.round(fare).toLocaleString('en-US') + " دينار";
}

function orderTaxi() {

  let from = document.getElementById('from').value;
  let to = document.getElementById('to').value;

  if (!from || !to) {
    alert("يرجى إدخال الانطلاق والوجهة");
    return;
  }

  if (fare <= 0) {
    alert("احسب الأجرة أولاً");
    return;
  }

  let order = {
    from: from,
    to: to,
    fare: Math.round(fare),
    status: "بانتظار السائق",
    date: new Date().toLocaleString('ar-IQ')
  };

  orders.push(order);

  renderOrders();

  alert("تم تسجيل الطلب على هذا الجهاز، لكن لم يتم إرساله إلى سائق.");

}

function renderOrders() {

  let list = document.getElementById('orderList');

  list.innerHTML = "";

  orders.forEach(function(order, index) {

    let div = document.createElement('div');
    div.className = 'order';

    let title = document.createElement('b');
    title.textContent = "طلب رقم " + (index + 1);

    let details = document.createElement('p');
    details.textContent =
      "من: " + order.from +
      " | إلى: " + order.to +
      " | الأجرة: " + order.fare + " دينار";

    let status = document.createElement('p');
    status.textContent = order.status;

    div.append(title, details, status);
    list.appendChild(div);

  });

}

function showPage(page) {

  ['home', 'orders', 'driver'].forEach(function(id) {
    document.getElementById(id).classList.add('hidden');
  });

  document.getElementById(page).classList.remove('hidden');

  if (page === 'home') {
    setTimeout(() => map.invalidateSize(), 100);
  }
}

function changeDriver() {

  let status =
  document.getElementById('driverStatus').value;

  document.getElementById('driverMessage').innerText =
  "حالة السائق: " + status;

}

</script>

</body>
</html>
