
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102d55">
<title>تكسي العراق</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f4f6f9;color:#142b49}
header{height:60px;background:#102d55;color:white;
display:flex;align-items:center;justify-content:center;
font-size:22px;font-weight:bold}
header span{color:#e6bd60;margin-left:9px}
#map{height:calc(100vh - 60px);width:100%}
.panel{position:fixed;bottom:0;right:0;width:100%;
background:white;border-radius:24px 24px 0 0;
padding:20px 17px 25px;z-index:500;
box-shadow:0 -4px 20px #0002}
.handle{width:45px;height:5px;background:#ddd;
border-radius:10px;margin:-8px auto 17px}
h3{margin:0 0 8px;font-size:21px}
.small{font-size:14px;color:#777;margin-bottom:15px}
.destination{width:100%;padding:17px;border:1px solid #ddd;
border-radius:13px;background:#f5f7fa;text-align:right;
font-size:16px;color:#18314f}
button{cursor:pointer}
.main-btn{width:100%;padding:17px;background:#102d55;
color:white;border:0;border-radius:13px;font-size:18px;
font-weight:bold;margin-top:15px}
.main-btn:disabled{background:#aab3bf}
.secondary{width:100%;padding:14px;border:0;
border-radius:12px;background:#edf0f5;color:#102d55;
font-size:16px;margin-top:10px}
.location-btn{position:absolute;top:75px;left:15px;
width:50px;height:50px;border:0;border-radius:13px;
background:white;font-size:24px;z-index:450}
.details{display:flex;justify-content:space-between;
margin-top:15px;font-size:15px}
.price{color:#bd9135;font-weight:bold;font-size:20px}
#confirmPanel,#successPanel{display:none}
#status{text-align:center;font-size:13px;
color:#777;margin-top:12px}
.success{text-align:center;color:#236c43;
background:#e9f7ed;padding:15px;border-radius:12px}
</style>
</head>

<body>

<header><span>🚕</span> تكسي العراق</header>

<div id="map"></div>

<button class="location-btn" onclick="getLocation()">📍</button>

<div class="panel" id="mainPanel">
<div class="handle"></div>

<h3>وين تريد تروح؟</h3>
<div class="small">حدد وجهتك واحنا نوصلّك بأمان</div>

<button class="destination" onclick="selectDestination()">
📍 <span id="destinationText">اضغط هنا لتحديد وجهتك</span>
</button>

<div class="details">
<span>🚗 المسافة</span>
<b id="distance">-- كم</b>
</div>

<div class="details">
<span>💰 الأجرة التقديرية</span>
<span class="price" id="price">-- دينار</span>
</div>

<button class="main-btn" id="orderButton"
onclick="openConfirmation()" disabled>
🚕 اطلب تكسي
</button>

<div id="status">حدد موقعك ووجهتك للبدء</div>
</div>

<div class="panel" id="confirmPanel">
<div class="handle"></div>
<h3>تأكيد الرحلة</h3>

<div class="details">
<span>موقع الانطلاق</span>
<b>موقعي الحالي</b>
</div>

<div class="details">
<span>الوجهة</span>
<b id="finalDestination">--</b>
</div>

<div class="details">
<span>المسافة</span>
<b id="finalDistance">--</b>
</div>

<div class="details">
<span>الأجرة</span>
<span class="price" id="finalPrice">--</span>
</div>

<button class="main-btn" onclick="sendOrder()">
تأكيد طلب التكسي
</button>

<button class="secondary" onclick="backHome()">
رجوع
</button>
</div>

<div class="panel" id="successPanel">
<div class="handle"></div>
<div class="success">
<h2>✅ تم تسجيل الطلب</h2>
<p>تم حفظ طلبك على هذا الجهاز.</p>
<p>هذه نسخة تجريبية ولا يوجد سائق متصل حالياً.</p>
</div>
<button class="main-btn" onclick="newTrip()">
طلب رحلة جديدة
</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// إعداد الخريطة
const map = L.map('map').setView([31.057,46.257],14);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}).addTo(map);

// متغيرات التطبيق
let currentLocation = null;
let destination = null;
let userMarker = null;
let destinationMarker = null;
let route = null;
let distanceKm = 0;
let fare = 0;
let selecting = false;

const BASE_PRICE = 1500;
const KM_PRICE = 500;

// تحديد موقع المستخدم
function getLocation(){

if(!navigator.geolocation){
alert('جهازك لا يدعم تحديد الموقع');
return;
}

document.getElementById('status').innerText =
'جارٍ تحديد موقعك...';

navigator.geolocation.getCurrentPosition(

function(position){

currentLocation=[
position.coords.latitude,
position.coords.longitude
];

map.setView(currentLocation,16);

if(userMarker) map.removeLayer(userMarker);

userMarker=L.marker(currentLocation)
.addTo(map)
.bindPopup('موقع الانطلاق');

document.getElementById('status').innerText =
'تم تحديد موقعك بنجاح';

if(destination) calculateFare();

},

function(){
alert('تعذر تحديد موقعك. فعّل GPS واسمح للمتصفح بالوصول إليه.');
},

{enableHighAccuracy:true,timeout:15000}
);
}

// اختيار الوجهة
function selectDestination(){

selecting=true;

document.getElementById('destinationText').innerText =
'اضغط على موقع الوصول في الخريطة';

document.getElementById('status').innerText =
'اضغط على الخريطة لاختيار الوجهة';

}

// عند الضغط على الخريطة
map.on('click',function(event){

if(!selecting)return;

destination=[
event.latlng.lat,
event.latlng.lng
];

selecting=false;

if(destinationMarker)map.removeLayer(destinationMarker);

destinationMarker=L.marker(destination)
.addTo(map)
.bindPopup('وجهتك');

document.getElementById('destinationText').innerText =
'تم تحديد الوجهة بنجاح';

if(!currentLocation){
document.getElementById('status').innerText =
'حدد موقع الانطلاق أولاً';
return;
}

calculateFare();

});

// حساب المسافة بخط مستقيم
function calculateDistance(a,b){

const R=6371;
const rad=x=>x*Math.PI/180;

const dLat=rad(b[0]-a[0]);
const dLon=rad(b[1]-a[1]);

const x=
Math.sin(dLat/2)**2+
Math.cos(rad(a[0]))*
Math.cos(rad(b[0]))*
Math.sin(dLon/2)**2;

return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// حساب الأجرة
function calculateFare(){

distanceKm=calculateDistance(currentLocation,destination);

fare=BASE_PRICE+(distanceKm*KM_PRICE);

document.getElementById('distance').innerText =
distanceKm.toFixed(1)+' كم';

document.getElementById('price').innerText =
Math.round(fare).toLocaleString('en-US')+' دينار';

document.getElementById('orderButton').disabled=false;

document.getElementById('status').innerText =
'تم حساب الأجرة التقديرية';

if(route)map.removeLayer(route);

route=L.polyline(
[currentLocation,destination],
{color:'#d2a63f',weight:5,dashArray:'8,8'}
).addTo(map);

map.fitBounds(route.getBounds(),{padding:[50,50]});

}

// تأكيد الطلب
function openConfirmation(){

if(!currentLocation||!destination){
alert('حدد موقع الانطلاق والوجهة');
return;
}

document.getElementById('finalDestination').innerText =
destination.map(x=>x.toFixed(4)).join(', ');

document.getElementById('finalDistance').innerText =
distanceKm.toFixed(1)+' كم';

document.getElementById('finalPrice').innerText =
Math.round(fare).toLocaleString('en-US')+' دينار';

showPanel('confirmPanel');

}

// حفظ الطلب محلياً
function sendOrder(){

const order={
from:currentLocation,
to:destination,
distance:distanceKm.toFixed(2),
price:Math.round(fare),
date:new Date().toISOString(),
status:'بانتظار السائق'
};

let orders=JSON.parse(localStorage.getItem('taxiOrders')||'[]');

orders.push(order);

localStorage.setItem('taxiOrders',JSON.stringify(orders));

showPanel('successPanel');

}

// الرجوع
function backHome(){
showPanel('mainPanel');
setTimeout(()=>map.invalidateSize(),200);
}

// رحلة جديدة
function newTrip(){

destination=null;
distanceKm=0;
fare=0;

if(destinationMarker)map.removeLayer(destinationMarker);
if(route)map.removeLayer(route);

destinationMarker=null;
route=null;

document.getElementById('destinationText').innerText =
'اضغط هنا لتحديد وجهتك';

document.getElementById('distance').innerText='-- كم';
document.getElementById('price').innerText='-- دينار';
document.getElementById('orderButton').disabled=true;

showPanel('mainPanel');
setTimeout(()=>map.invalidateSize(),200);

}

// تبديل الشاشات
function showPanel(id){

['mainPanel','confirmPanel','successPanel'].forEach(panel=>{
document.getElementById(panel).style.display='none';
});

document.getElementById(id).style.display='block';

setTimeout(()=>map.invalidateSize(),200);

}

</script>
</body>
</html>
